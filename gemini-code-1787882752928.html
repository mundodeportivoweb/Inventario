function useStorageState(key, seedFn) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw) {
        setData(JSON.parse(raw));
      } else {
        const seeded = seedFn();
        window.localStorage.setItem(key, JSON.stringify(seeded));
        setData(seeded);
      }
    } catch (e) {
      console.error("storage read error", e);
      setData(seedFn());
    } finally {
      setLoading(false);
    }
  }, [key]);

  const persist = (next) => {
    setData(next);
    try {
      window.localStorage.setItem(key, JSON.stringify(next));
    } catch (e) {
      console.error("storage set error", e);
    }
  };

  return [data, persist, loading];
}

function Dashboard({ products, sales }) {
  const totalProductos = products.length;
  const unidadesStock = products.reduce((s, p) => s + Number(p.stock), 0);
  const valorInventario = products.reduce((s, p) => s + Number(p.stock) * Number(p.precio), 0);
  const unidadesVendidas = products.reduce((s, p) => s + Number(p.vendidos), 0);
  const ingresos = sales.reduce((s, v) => s + Number(v.total), 0);
  const bajoStock = products.filter((p) => Number(p.stock) <= LOW_STOCK);

  return (
    <div>
      <h2 className="text-2xl mb-5" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>PANEL GENERAL</h2>
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
        <StatCard label="Productos" value={totalProductos} icon={IconBox} />
        <StatCard label="Unidades en stock" value={unidadesStock} icon={IconBox} />
        <StatCard label="Valor inventario" value={money(valorInventario)} icon={IconDollar} />
        <StatCard label="Unidades vendidas" value={unidadesVendidas} icon={IconTrendUp} />
        <StatCard label="Ingresos totales" value={money(ingresos)} icon={IconCart} />
        <StatCard label="Stock bajo" value={bajoStock.length} icon={IconAlert} accent="#B23A2E" />
      </div>

      <div className="rounded-sm p-4" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <div className="flex items-center gap-2 mb-3">
          <IconAlert size={16} color="#B23A2E" />
          <h3 className="text-sm font-semibold" style={{ color: "#20211D" }}>Productos con stock bajo (≤ {LOW_STOCK} unidades)</h3>
        </div>
        {bajoStock.length === 0 ? (
          <p className="text-sm" style={{ color: "#8A8272" }}>No hay productos con stock bajo por ahora.</p>
        ) : (
          <ul className="divide-y" style={{ borderColor: "#E4DCC8" }}>
            {bajoStock.map((p) => (
              <li key={p.id} className="flex items-center justify-between py-2 text-sm">
                <span style={{ color: "#20211D" }}>{p.nombre} — {p.marca} (talla {p.talla})</span>
                <span className="font-mono font-semibold" style={{ color: "#B23A2E" }}>{p.stock} u.</span>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

// ---------- Modal de Cámara con Inteligencia Artificial (MobileNet) ----------
function CameraModal({ onClose, onCapture }) {
  const videoRef = useRef(null);
  const [stream, setStream] = useState(null);
  const [loadingModel, setLoadingModel] = useState(false);
  const [model, setModel] = useState(null);

  useEffect(() => {
    // Cargar el modelo de IA MobileNet
    setLoadingModel(true);
    if (window.mobilenet) {
      window.mobilenet.load().then((m) => {
        setModel(m);
        setLoadingModel(false);
      }).catch((e) => {
        console.error("Error al cargar la IA", e);
        setLoadingModel(false);
      });
    }

    navigator.mediaDevices?.getUserMedia({ video: { facingMode: "environment" } })
      .then((s) => {
        setStream(s);
        if (videoRef.current) videoRef.current.srcObject = s;
      })
      .catch((err) => console.error("Error al acceder a la cámara:", err));

    return () => {
      if (stream) stream.getTracks().forEach((track) => track.stop());
    };
  }, []);

  const takePhotoAndAnalyze = async () => {
    const video = videoRef.current;
    if (!video) return;

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 300;
    canvas.height = video.videoHeight || 300;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg");

    let detectedText = "";
    if (model) {
      // Analizar la imagen con la IA
      const predictions = await model.classify(video);
      if (predictions && predictions.length > 0) {
        // Tomamos el primer resultado devuelto por la IA
        detectedText = predictions[0].className;
      }
    }

    if (stream) stream.getTracks().forEach((track) => track.stop());
    onCapture(dataUrl, detectedText);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(32,33,29,0.8)" }}>
      <div className="w-full max-w-sm rounded-sm p-5" style={{ background: "#FAF6EE" }}>
        <div className="flex items-center justify-between mb-3">
          <h3 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 18, color: "#20211D" }}>BUSCAR CON IA (CÁMARA)</h3>
          <button onClick={onClose}><IconX size={18} color="#8A8272" /></button>
        </div>

        <div className="relative bg-black rounded-sm overflow-hidden mb-4" style={{ height: 240 }}>
          <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
          {loadingModel && (
            <div className="absolute inset-0 bg-black/60 flex items-center justify-center text-white text-xs font-mono">
              Cargando Modelo IA...
            </div>
          )}
        </div>

        <button onClick={takePhotoAndAnalyze} className="w-full py-2.5 rounded-sm font-semibold text-sm flex items-center justify-center gap-2"
          style={{ background: "#B8863C", color: "#20211D", fontFamily: "'Oswald', sans-serif" }}>
          <IconCamera size={18} /> ESCANEAR Y ANALIZAR
        </button>
      </div>
    </div>
  );
}

function ProductFormModal({ initial, onClose, onSave }) {
  const [form, setForm] = useState(initial || { nombre: "", marca: "", categoria: CATEGORIAS[0], talla: "", color: "", stock: "", precio: "", imagen: "" });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => set("imagen", reader.result);
      reader.readAsDataURL(file);
    }
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.nombre || !form.marca || !form.talla || form.stock === "" || form.precio === "") return;
    onSave({ ...form, talla: Number(form.talla), stock: Number(form.stock), precio: Number(form.precio) });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(32,33,29,0.6)" }}>
      <div className="w-full max-w-md rounded-sm p-6 max-h-[90vh] overflow-y-auto" style={{ background: "#FAF6EE" }}>
        <div className="flex items-center justify-between mb-4">
          <h3 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 20, color: "#20211D" }}>{initial ? "EDITAR PRODUCTO" : "NUEVO PRODUCTO"}</h3>
          <button onClick={onClose}><IconX size={18} color="#8A8272" /></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <div>
            <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: "#8A8272" }}>Imagen del Producto</label>
            <div className="flex items-center gap-3">
              {form.imagen ? (
                <img src={form.imagen} className="w-14 h-14 object-cover rounded border" style={{ borderColor: "#E4DCC8" }} />
              ) : (
                <div className="w-14 h-14 rounded border flex items-center justify-center text-[10px]" style={{ borderColor: "#E4DCC8", color: "#8A8272" }}>Sin foto</div>
              )}
              <input type="file" accept="image/*" onChange={handleFile} className="text-xs" />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Nombre</label>
              <input value={form.nombre} onChange={(e) => set("nombre", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Marca</label>
              <input value={form.marca} onChange={(e) => set("marca", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
          </div>
          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Categoría</label>
              <select value={form.categoria} onChange={(e) => set("categoria", e.target.value)}
                className="w-full mt-1 px-2 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }}>
                {CATEGORIAS.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Talla</label>
              <input type="number" value={form.talla} onChange={(e) => set("talla", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Color</label>
              <input value={form.color} onChange={(e) => set("color", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Stock inicial</label>
              <input type="number" value={form.stock} onChange={(e) => set("stock", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Precio (USD)</label>
              <input type="number" step="0.01" value={form.precio} onChange={(e) => set("precio", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
          </div>
          <button type="submit" className="w-full mt-2 py-2.5 rounded-sm font-semibold text-sm tracking-wide"
            style={{ background: "#20211D", color: "#EFE7D8", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em" }}>
            {initial ? "GUARDAR CAMBIOS" : "AGREGAR PRODUCTO"}
          </button>
        </form>
      </div>
    </div>
  );
}

function Inventario({ products, isOwner, onAdd, onUpdate, onDelete }) {
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);
  const [showCamera, setShowCamera] = useState(false);
  const [capturedPhoto, setCapturedPhoto] = useState(null);
  const [aiTag, setAiTag] = useState("");

  const filtered = useMemo(() => {
    const s = search.toLowerCase();
    return products.filter((p) => p.nombre.toLowerCase().includes(s) || p.marca.toLowerCase().includes(s) || p.categoria.toLowerCase().includes(s));
  }, [products, search]);

  const handleAiCapture = (photo, tag) => {
    setCapturedPhoto(photo);
    setAiTag(tag);
    setShowCamera(false);

    // Mapeo inteligente del resultado de la IA a las categorías/búsqueda del inventario
    const tagLower = tag.toLowerCase();
    if (tagLower.includes("running") || tagLower.includes("sneaker") || tagLower.includes("shoe")) {
      setSearch("Deportivo");
    } else if (tagLower.includes("sandal") || tagLower.includes("clog")) {
      setSearch("Sandalia");
    } else if (tagLower.includes("boot")) {
      setSearch("Bota");
    } else {
      setSearch(tag.split(",")[0]);
    }
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <h2 className="text-2xl" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>INVENTARIO</h2>
        <div className="flex items-center gap-2">
          <div className="flex items-center gap-2 px-3 py-2 rounded-sm" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
            <IconSearch size={15} color="#8A8272" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar producto, marca..."
              className="text-sm outline-none bg-transparent" style={{ width: 180 }} />
          </div>

          <button onClick={() => setShowCamera(true)} className="flex items-center gap-1.5 px-3 py-2 rounded-sm text-sm font-medium border"
            style={{ borderColor: "#B8863C", color: "#20211D", background: "#FAF6EE" }}>
            <IconCamera size={16} color="#B8863C" />
            <span className="hidden sm:inline">Escanear IA</span>
          </button>

          {isOwner && (
            <button onClick={() => setModal("new")} className="flex items-center gap-1.5 px-3 py-2 rounded-sm text-sm font-semibold" style={{ background: "#B8863C", color: "#20211D" }}>
              <IconPlus size={16} /> Nuevo
            </button>
          )}
        </div>
      </div>

      {capturedPhoto && (
        <div className="mb-4 p-3 rounded-sm flex items-center justify-between" style={{ background: "#E4DCC8" }}>
          <div className="flex items-center gap-3">
            <img src={capturedPhoto} className="w-10 h-10 object-cover rounded" />
            <div>
              <div className="text-xs font-semibold" style={{ color: "#20211D" }}>Reconocimiento de IA aplicado</div>
              <div className="text-[11px] font-mono" style={{ color: "#8A8272" }}>Detectado: {aiTag || "Sin clasificación"}</div>
            </div>
          </div>
          <button onClick={() => { setCapturedPhoto(null); setAiTag(""); setSearch(""); }} className="text-xs font-semibold underline" style={{ color: "#B23A2E" }}>
            Limpiar filtro
          </button>
        </div>
      )}

      <div className="rounded-sm overflow-hidden" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <table className="w-full text-sm">
          <thead>
            <tr style={{ background: "#F1EADA", color: "#8A8272" }}>
              <th className="text-left px-3 py-2.5 font-mono text-[11px] uppercase tracking-widest">Foto</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Stock</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Producto</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Marca</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Categoría</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Talla</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Precio</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Vendidos</th>
              {isOwner && <th className="text-right px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Acciones</th>}
            </tr>
          </thead>
          <tbody>
            {filtered.map((p) => (
              <tr key={p.id} style={{ borderTop: "1px solid #F1EADA" }}>
                <td className="px-3 py-3">
                  {p.imagen ? (
                    <img src={p.imagen} className="w-10 h-10 object-cover rounded-sm" />
                  ) : (
                    <div className="w-10 h-10 rounded-sm flex items-center justify-center text-[9px]" style={{ background: "#F1EADA", color: "#8A8272" }}>Sin foto</div>
                  )}
                </td>
                <td className="px-4 py-3"><StampBadge value={p.stock} danger={p.stock <= LOW_STOCK} /></td>
                <td className="px-4 py-3 font-medium" style={{ color: "#20211D" }}>{p.nombre}<div className="text-xs" style={{ color: "#8A8272" }}>{p.color}</div></td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{p.marca}</td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{p.categoria}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{p.talla}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{money(p.precio)}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{p.vendidos}</td>
                {isOwner && (
                  <td className="px-4 py-3">
                    <div className="flex items-center justify-end gap-2">
                      <button onClick={() => setModal(p)}><IconEdit size={15} color="#8A8272" /></button>
                      <button onClick={() => onDelete(p.id)}><IconTrash size={15} color="#B23A2E" /></button>
                    </div>
                  </td>
                )}
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan={isOwner ? 9 : 8} className="text-center py-8 text-sm" style={{ color: "#8A8272" }}>Sin resultados para el análisis de IA.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {showCamera && <CameraModal onClose={() => setShowCamera(false)} onCapture={handleAiCapture} />}
      {modal && (
        <ProductFormModal
          initial={modal === "new" ? null : modal}
          onClose={() => setModal(null)}
          onSave={(data) => { if (modal === "new") onAdd(data); else onUpdate(modal.id, data); setModal(null); }}
        />
      )}
    </div>
  );
}

function Vender({ products, onVender, user }) {
  const [productoId, setProductoId] = useState(products[0]?.id || "");
  const [cantidad, setCantidad] = useState(1);
  const [msg, setMsg] = useState(null);

  useEffect(() => { if (!productoId && products[0]) setProductoId(products[0].id); }, [products]);

  const producto = products.find((p) => p.id === productoId);
  const total = producto ? producto.precio * Number(cantidad || 0) : 0;

  const submit = (e) => {
    e.preventDefault();
    if (!producto) return;
    const cant = Number(cantidad);
    if (!cant || cant <= 0) { setMsg({ type: "error", text: "Ingresa una cantidad válida." }); return; }
    if (cant > producto.stock) { setMsg({ type: "error", text: `Solo hay ${producto.stock} unidades disponibles.` }); return; }
    onVender(producto, cant, user);
    setMsg({ type: "ok", text: `Venta registrada: ${cant} × ${producto.nombre} — ${money(cant * producto.precio)}` });
    setCantidad(1);
  };

  return (
    <div>
      <h2 className="text-2xl mb-5" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>REGISTRAR VENTA</h2>
      <div className="max-w-md rounded-sm p-5" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Producto</label>
            <select value={productoId} onChange={(e) => setProductoId(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8" }}>
              {products.map((p) => <option key={p.id} value={p.id}>{p.nombre} — {p.marca} (talla {p.talla}) · stock {p.stock}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Cantidad</label>
            <input type="number" min={1} value={cantidad} onChange={(e) => setCantidad(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8" }} />
          </div>
          <StitchDivider />
          <div className="flex items-center justify-between text-sm">
            <span style={{ color: "#8A8272" }}>Total a cobrar</span>
            <span className="font-mono text-lg font-bold" style={{ color: "#20211D" }}>{money(total)}</span>
          </div>
          {msg && <p className="text-xs" style={{ color: msg.type === "ok" ? "#4C7A5D" : "#B23A2E" }}>{msg.text}</p>}
          <button type="submit" disabled={!producto} className="w-full py-2.5 rounded-sm font-semibold text-sm tracking-wide flex items-center justify-center gap-2"
            style={{ background: "#B8863C", color: "#20211D", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em" }}>
            <IconCart size={16} /> CONFIRMAR VENTA
          </button>
        </form>
      </div>
    </div>
  );
}

function Historial({ sales }) {
  const sorted = [...sales].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  const ingresos = sales.reduce((s, v) => s + Number(v.total), 0);
  const unidades = sales.reduce((s, v) => s + Number(v.cantidad), 0);

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h2 className="text-2xl" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>HISTORIAL DE VENTAS</h2>
        <div className="flex gap-3 text-sm font-mono" style={{ color: "#20211D" }}>
          <span>{unidades} unidades</span><span>·</span><span className="font-semibold">{money(ingresos)}</span>
        </div>
      </div>
      <div className="rounded-sm overflow-hidden" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <table className="w-full text-sm">
          <thead>
            <tr style={{ background: "#F1EADA", color: "#8A8272" }}>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Fecha</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Producto</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Cant.</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Precio unit.</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Total</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Vendedor</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((v) => (
              <tr key={v.id} style={{ borderTop: "1px solid #F1EADA" }}>
                <td className="px-4 py-3 font-mono text-xs" style={{ color: "#8A8272" }}>{new Date(v.fecha).toLocaleString("es-EC", { dateStyle: "medium", timeStyle: "short" })}</td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{v.productoNombre} <span className="text-xs" style={{ color: "#8A8272" }}>(talla {v.talla})</span></td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{v.cantidad}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{money(v.precioUnitario)}</td>
                <td className="px-4 py-3 font-mono font-semibold" style={{ color: "#20211D" }}>{money(v.total)}</td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{v.vendedor}</td>
              </tr>
            ))}
            {sorted.length === 0 && <tr><td colSpan={6} className="text-center py-8 text-sm" style={{ color: "#8A8272" }}>Todavía no hay ventas registradas.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Empleados({ users, onAdd, onDelete, currentUser }) {
  const [form, setForm] = useState({ usuario: "", password: "", nombre: "" });
  const [error, setError] = useState("");

  const submit = (e) => {
    e.preventDefault();
    if (!form.usuario || !form.password || !form.nombre) return;
    if (users.some((u) => u.usuario === form.usuario)) { setError("Ese usuario ya existe."); return; }
    onAdd({ ...form, rol: "empleado" });
    setForm({ usuario: "", password: "", nombre: "" });
    setError("");
  };

  return (
    <div>
      <h2 className="text-2xl mb-5" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>PERSONAL</h2>
      <div className="grid md:grid-cols-2 gap-5">
        <div className="rounded-sm p-5" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
          <h3 className="text-sm font-semibold mb-3" style={{ color: "#20211D" }}>Cuentas actuales</h3>
          <ul className="divide-y" style={{ borderColor: "#F1EADA" }}>
            {users.map((u) => (
              <li key={u.usuario} className="flex items-center justify-between py-2.5 text-sm">
                <div>
                  <span style={{ color: "#20211D" }}>{u.nombre}</span>
                  <div className="text-xs font-mono" style={{ color: "#8A8272" }}>@{u.usuario} · {u.rol}</div>
                </div>
                {u.rol !== "dueño" && u.usuario !== currentUser.usuario && (
                  <button onClick={() => onDelete(u.usuario)}><IconTrash size={15} color="#B23A2E" /></button>
                )}
              </li>
            ))}
          </ul>
        </div>
        <div className="rounded-sm p-5" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
          <h3 className="text-sm font-semibold mb-3" style={{ color: "#20211D" }}>Agregar empleado</h3>
          <form onSubmit={submit} className="space-y-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Nombre completo</label>
              <input value={form.nombre} onChange={(e) => setForm((f) => ({ ...f, nombre: e.target.value }))} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Usuario</label>
              <input value={form.usuario} onChange={(e) => setForm((f) => ({ ...f, usuario: e.target.value }))} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272" }}>Contraseña</label>
              <input value={form.password} onChange={(e) => setForm((f) => ({ ...f, password: e.target.value }))} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8" }} />
            </div>
            {error && <p className="text-xs" style={{ color: "#B23A2E" }}>{error}</p>}
            <button type="submit" className="w-full py-2.5 rounded-sm font-semibold text-sm tracking-wide" style={{ background: "#20211D", color: "#EFE7D8", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em" }}>
              AGREGAR EMPLEADO
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [users, persistUsers, loadingUsers] = useStorageState("zapatos_users", seedUsers);
  const [products, persistProducts, loadingProducts] = useStorageState("zapatos_products", seedProducts);
  const [sales, persistSales, loadingSales] = useStorageState("zapatos_sales", () => []);

  const [currentUser, setCurrentUser] = useState(null);
  const [view, setView] = useState("dashboard");

  const loading = loadingUsers || loadingProducts || loadingSales;

  const login = (usuario, password) => {
    const found = (users || []).find((u) => u.usuario === usuario && u.password === password);
    if (found) { setCurrentUser(found); setView("dashboard"); return true; }
    return false;
  };

  const isOwner = currentUser?.rol === "dueño";

  const addProduct = (data) => persistProducts([...(products || []), { id: `p_${Date.now()}`, vendidos: 0, ...data }]);
  const updateProduct = (id, data) => persistProducts((products || []).map((p) => (p.id === id ? { ...p, ...data } : p)));
  const deleteProduct = (id) => persistProducts((products || []).filter((p) => p.id !== id));

  const registrarVenta = (producto, cantidad, user) => {
    const nuevaVenta = {
      id: `v_${Date.now()}`, productoId: producto.id, productoNombre: producto.nombre, talla: producto.talla,
      cantidad, precioUnitario: producto.precio, total: producto.precio * cantidad,
      fecha: new Date().toISOString(), vendedor: user.nombre,
    };
    persistSales([...(sales || []), nuevaVenta]);
    persistProducts((products || []).map((p) => p.id === producto.id ? { ...p, stock: p.stock - cantidad, vendidos: p.vendidos + cantidad } : p));
  };

  const addEmpleado = (data) => persistUsers([...(users || []), data]);
  const deleteEmpleado = (usuario) => persistUsers((users || []).filter((u) => u.usuario !== usuario));

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: "#20211D" }}>
        <p style={{ color: "#EFE7D8", fontFamily: "'IBM Plex Mono', monospace" }}>Cargando inventario...</p>
      </div>
    );
  }

  if (!currentUser) return <LoginScreen onLogin={login} />;

  return (
    <div className="min-h-screen flex" style={{ background: "#F7F2E7" }}>
      <Sidebar user={currentUser} view={view} setView={setView} onLogout={() => setCurrentUser(null)} />
      <main className="flex-1 p-6 md:p-8 overflow-x-auto">
        {view === "dashboard" && <Dashboard products={products || []} sales={sales || []} />}
        {view === "inventario" && <Inventario products={products || []} isOwner={isOwner} onAdd={addProduct} onUpdate={updateProduct} onDelete={deleteProduct} />}
        {view === "vender" && <Vender products={products || []} onVender={registrarVenta} user={currentUser} />}
        {view === "historial" && <Historial sales={sales || []} />}
        {view === "empleados" && isOwner && <Empleados users={users || []} onAdd={addEmpleado} onDelete={deleteEmpleado} currentUser={currentUser} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
