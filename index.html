<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Santy Sport - Control de Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Scripts de TensorFlow.js y MobileNet para Reconocimiento por IA -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

  <style>
    body { font-family: 'IBM Plex Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const LOW_STOCK = 5;
    const CATEGORIAS = ["Deportivo", "Casual", "Formal", "Bota", "Sandalia", "Infantil"];

    const seedProducts = () => [
      { id: "p1", nombre: "Runner Air", marca: "Nordik", categoria: "Deportivo", talla: "42", color: "Negro", stock: 14, precio: 65.0, ventas: 12 },
      { id: "p2", nombre: "Classic Oxford", marca: "Belmont", categoria: "Formal", talla: "41", color: "Café", stock: 4, precio: 89.0, ventas: 8 },
      { id: "p3", nombre: "Trail Grip", marca: "Nordik", categoria: "Deportivo", talla: "43", color: "Gris", stock: 8, precio: 72.5, ventas: 15 }
    ];

    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('santysport_inventory');
        return saved ? JSON.parse(saved) : seedProducts();
      });

      const [search, setSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todas');
      const [editingProduct, setEditingProduct] = useState(null);
      const [showAddForm, setShowAddForm] = useState(false);
      const [newProduct, setNewProduct] = useState({ nombre: '', marca: '', categoria: 'Deportivo', talla: '', color: '', stock: '', precio: '' });
      
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [aiStatus, setAiStatus] = useState('');
      const videoRef = useRef(null);
      const [isCameraActive, setIsCameraActive] = useState(false);

      useEffect(() => {
        localStorage.setItem('santysport_inventory', JSON.stringify(products));
      }, [products]);

      const handleSaveEdit = (e) => {
        e.preventDefault();
        setProducts(products.map(p => p.id === editingProduct.id ? { ...editingProduct, stock: Number(editingProduct.stock), precio: Number(editingProduct.precio) } : p));
        setEditingProduct(null);
      };

      const handleDelete = (id) => {
        if (confirm("¿Estás seguro de eliminar este producto?")) {
          setProducts(products.filter(p => p.id !== id));
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        const item = {
          ...newProduct,
          id: 'p_' + Date.now(),
          stock: Number(newProduct.stock),
          precio: Number(newProduct.precio),
          ventas: 0
        };
        setProducts([item, ...products]);
        setNewProduct({ nombre: '', marca: '', categoria: 'Deportivo', talla: '', color: '', stock: '', precio: '' });
        setShowAddForm(false);
      };

      const startAiScan = async () => {
        setIsCameraActive(true);
        setIsAiLoading(true);
        setAiStatus('Cargando cámara...');
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } }).catch(() => {
            return navigator.mediaDevices.getUserMedia({ video: true });
          });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
          }
          const model = await mobilenet.load();
          setAiStatus('Escaneando calzado...');

          setTimeout(async () => {
            if (videoRef.current) {
              const predictions = await model.classify(videoRef.current);
              if (predictions.length > 0) {
                const topPrediction = predictions[0].className.toLowerCase();
                setAiStatus(`Detectado: ${predictions[0].className}`);
                
                if (topPrediction.includes('sneaker') || topPrediction.includes('running shoe') || topPrediction.includes('shoe')) {
                  setSelectedCategory('Deportivo');
                } else if (topPrediction.includes('sandal')) {
                  setSelectedCategory('Sandalia');
                } else if (topPrediction.includes('boot')) {
                  setSelectedCategory('Bota');
                }
              }
              stopCamera();
            }
          }, 2500);
        } catch (err) {
          alert('Error al acceder a la cámara trasera.');
          stopCamera();
        } finally {
          setIsAiLoading(false);
        }
      };

      const stopCamera = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach(track => track.stop());
        }
        setIsCameraActive(false);
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCategory = selectedCategory === 'Todas' || p.categoria === selectedCategory;
          const matchSearch = p.nombre.toLowerCase().includes(search.toLowerCase()) || p.marca.toLowerCase().includes(search.toLowerCase());
          return matchCategory && matchSearch;
        });
      }, [products, selectedCategory, search]);

      return (
        <div className="max-w-md mx-auto p-4">
          {/* Cabecera Móvil */}
          <header className="flex justify-between items-center mb-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
              <h1 className="text-xl font-bold text-gray-900 leading-tight">Santy Sport</h1>
              <p className="text-xs text-gray-500">Inventario Móvil</p>
            </div>
            <button 
              onClick={() => setShowAddForm(!showAddForm)} 
              className="bg-green-600 active:bg-green-700 text-white font-bold px-3 py-2 rounded-lg text-sm flex items-center gap-1 shadow"
            >
              {showAddForm ? '✕ Cerrar' : '＋ Nuevo'}
            </button>
          </header>

          {/* Botón de Escáner IA destacado */}
          <button 
            onClick={startAiScan} 
            className="w-full mb-4 bg-blue-600 active:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-md text-base"
          >
            📷 Buscar Calzado con IA
          </button>

          {/* Visor de Cámara Móvil */}
          {isCameraActive && (
            <div className="mb-4 bg-black p-3 rounded-xl flex flex-col items-center">
              <video ref={videoRef} className="w-full h-48 object-cover rounded-lg" playsInline />
              <p className="text-white mt-2 text-xs text-center font-medium">{aiStatus}</p>
              <button onClick={stopCamera} className="mt-2 bg-red-600 text-white text-xs px-4 py-2 rounded-lg font-bold">Cancelar Escaneo</button>
            </div>
          )}

          {/* Formulario Agregar (Desplegable) */}
          {showAddForm && (
            <div className="bg-white p-4 rounded-xl shadow-md border border-gray-100 mb-4">
              <h2 className="text-md font-bold mb-3 text-gray-800">Agregar Nuevo Producto</h2>
              <form onSubmit={handleAddProduct} className="space-y-3">
                <input required placeholder="Nombre del calzado" className="w-full border p-2.5 rounded-lg text-sm" value={newProduct.nombre} onChange={e => setNewProduct({...newProduct, nombre: e.target.value})} />
                <div className="grid grid-cols-2 gap-2">
                  <input required placeholder="Marca" className="border p-2.5 rounded-lg text-sm" value={newProduct.marca} onChange={e => setNewProduct({...newProduct, marca: e.target.value})} />
                  <select className="border p-2.5 rounded-lg text-sm bg-white" value={newProduct.categoria} onChange={e => setNewProduct({...newProduct, categoria: e.target.value})}>
                    {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input required placeholder="Talla (ej: 40)" className="border p-2.5 rounded-lg text-sm" value={newProduct.talla} onChange={e => setNewProduct({...newProduct, talla: e.target.value})} />
                  <input required placeholder="Color" className="border p-2.5 rounded-lg text-sm" value={newProduct.color} onChange={e => setNewProduct({...newProduct, color: e.target.value})} />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input required type="number" placeholder="Stock" className="border p-2.5 rounded-lg text-sm" value={newProduct.stock} onChange={e => setNewProduct({...newProduct, stock: e.target.value})} />
                  <input required type="number" step="0.01" placeholder="Precio ($)" className="border p-2.5 rounded-lg text-sm" value={newProduct.precio} onChange={e => setNewProduct({...newProduct, precio: e.target.value})} />
                </div>
                <button type="submit" className="w-full bg-green-600 active:bg-green-700 text-white font-bold p-3 rounded-lg text-sm shadow">Guardar en Inventario</button>
              </form>
            </div>
          )}

          {/* Filtros Móviles */}
          <div className="space-y-2 mb-4">
            <input 
              type="text" 
              placeholder="🔍 Buscar modelo o marca..." 
              className="w-full border p-3 rounded-xl shadow-sm text-sm"
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
              <button 
                onClick={() => setSelectedCategory('Todas')}
                className={`px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${selectedCategory === 'Todas' ? 'bg-gray-900 text-white' : 'bg-white text-gray-600 border'}`}
              >
                Todas
              </button>
              {CATEGORIAS.map(c => (
                <button 
                  key={c}
                  onClick={() => setSelectedCategory(c)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${selectedCategory === c ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border'}`}
                >
                  {c}
                </button>
              ))}
            </div>
          </div>

          {/* Lista tipo Tarjetas (Optimizada para Celular) */}
          <div className="space-y-3">
            {filteredProducts.length === 0 ? (
              <p className="text-center text-gray-500 py-8 text-sm">No se encontraron productos.</p>
            ) : (
              filteredProducts.map(p => (
                <div key={p.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                  <div className="flex justify-between items-start mb-2">
                    <div>
                      <span className="text-xs font-semibold uppercase tracking-wider text-blue-600">{p.categoria} • {p.marca}</span>
                      <h3 className="font-bold text-gray-900 text-base">{p.nombre}</h3>
                    </div>
                    <span className="text-lg font-bold text-gray-900">${p.precio.toFixed(2)}</span>
                  </div>

                  <div className="flex justify-between items-center text-xs text-gray-500 my-2 pt-2 border-t">
                    <span>Talla: <b className="text-gray-800">{p.talla}</b></span>
                    <span>Color: <b className="text-gray-800">{p.color}</b></span>
                    <span>Stock: <b className={`text-sm ${p.stock <= LOW_STOCK ? 'text-red-600' : 'text-gray-900'}`}>{p.stock} pares</b></span>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button 
                      onClick={() => setEditingProduct(p)} 
                      className="flex-1 bg-amber-50 active:bg-amber-100 text-amber-700 font-semibold py-2 rounded-lg text-xs border border-amber-200"
                    >
                      ✏️ Editar
                    </button>
                    <button 
                      onClick={() => handleDelete(p.id)} 
                      className="flex-1 bg-red-50 active:bg-red-100 text-red-600 font-semibold py-2 rounded-lg text-xs border border-red-200"
                    >
                      🗑️ Borrar
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>

          {/* Modal Móvil de Edición */}
          {editingProduct && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white p-5 rounded-t-2xl sm:rounded-xl w-full max-w-md shadow-2xl space-y-3">
                <h3 className="text-base font-bold text-gray-900 mb-2">Editar Producto</h3>
                <form onSubmit={handleSaveEdit} className="space-y-3">
                  <div>
                    <label className="text-xs text-gray-500 font-medium">Nombre</label>
                    <input className="w-full border p-2.5 rounded-lg text-sm" value={editingProduct.nombre} onChange={e => setEditingProduct({...editingProduct, nombre: e.target.value})} />
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 font-medium">Marca</label>
                    <input className="w-full border p-2.5 rounded-lg text-sm" value={editingProduct.marca} onChange={e => setEditingProduct({...editingProduct, marca: e.target.value})} />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-gray-500 font-medium">Stock</label>
                      <input type="number" className="w-full border p-2.5 rounded-lg text-sm" value={editingProduct.stock} onChange={e => setEditingProduct({...editingProduct, stock: e.target.value})} />
                    </div>
                    <div>
                      <label className="text-xs text-gray-500 font-medium">Precio ($)</label>
                      <input type="number" step="0.01" className="w-full border p-2.5 rounded-lg text-sm" value={editingProduct.precio} onChange={e => setEditingProduct({...editingProduct, precio: e.target.value})} />
                    </div>
                  </div>
                  <div className="flex gap-2 pt-3">
                    <button type="button" onClick={() => setEditingProduct(null)} className="flex-1 py-3 border rounded-lg text-sm font-semibold">Cancelar</button>
                    <button type="submit" className="flex-1 py-3 bg-blue-600 text-white rounded-lg text-sm font-bold shadow">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
