<!DOCTYPE html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const LOW_STOCK = 5;
const CATEGORIAS = ["Deportivo", "Casual", "Formal", "Bota", "Sandalia", "Infantil"];

const seedProducts = () => ([
  { id: "p1", nombre: "Runner Air", marca: "Nordik", categoria: "Deportivo", talla: 42, color: "Negro", stock: 14, precio: 65.0, vendidos: 23, imagen: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&auto=format&fit=crop" },
  { id: "p2", nombre: "Classic Oxford", marca: "Belmont", categoria: "Formal", talla: 41, color: "Café", stock: 4, precio: 89.0, vendidos: 9, imagen: "https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=400&auto=format&fit=crop" },
  { id: "p3", nombre: "Trail Grip", marca: "Nordik", categoria: "Deportivo", talla: 43, color: "Gris", stock: 8, precio: 72.5, vendidos: 15, imagen: "" },
]);

const seedUsers = () => ([
  { usuario: "admin", password: "admin123", rol: "dueño", nombre: "Santiago Robles" },
  { usuario: "empleado1", password: "empleado123", rol: "empleado", nombre: "Empleado Santy Sport" },
]);

const seedSales = () => ([
  { id: "v1", fecha: new Date().toISOString(), productoNombre: "Runner Air", talla: 42, cantidad: 2, precioUnitario: 65.0, total: 130.0, vendedor: "Santiago Robles" }
]);

const money = (n) => `$${Number(n || 0).toFixed(2)}`;

// ---------- Iconos SVG ----------
const Icon = ({ size = 18, color = "currentColor", children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const IconBox = (p) => <Icon {...p}><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></Icon>;
const IconGrid = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></Icon>;
const IconCart = (p) => <Icon {...p}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></Icon>;
const IconHistory = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></Icon>;
const IconUsers = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 7.75"/></Icon>;
const IconLogout = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></Icon>;
const IconPlus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14"/></Icon>;
const IconSearch = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></Icon>;
const IconTrendUp = (p) => <Icon {...p}><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></Icon>;
const IconAlert = (p) => <Icon {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></Icon>;
const IconEdit = (p) => <Icon {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Icon>;
const IconTrash = (p) => <Icon {...p}><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></Icon>;
const IconDollar = (p) => <Icon {...p}><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
const IconX = (p) => <Icon {...p}><path d="M18 6L6 18"/><path d="M6 6l12 12"/></Icon>;
const IconUser = (p) => <Icon {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
const IconLock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
const IconChevronRight = (p) => <Icon {...p}><path d="M9 18l6-6-6-6"/></Icon>;
const IconImage = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Icon>;
const IconUpload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Icon>;
const IconSparkles = (p) => <Icon {...p}><path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/></Icon>;

function useStorageState(key, seedFn) {
  const [data, setData] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : seedFn();
    } catch {
      return seedFn();
    }
  });

  const persist = (next) => {
    setData(next);
    try { window.localStorage.setItem(key, JSON.stringify(next)); } catch (e) {}
  };

  return [data, persist];
}

function StitchDivider() {
  return <div className="border-t border-dashed my-3" style={{ borderColor: "#D8CCA8" }} />;
}

function StampBadge({ value, danger }) {
  return (
    <div
      className="flex items-center justify-center rounded-full font-mono text-xs font-bold shrink-0"
      style={{
        width: 38, height: 38,
        border: `2px solid ${danger ? "#B23A2E" : "#20211D"}`,
        color: danger ? "#B23A2E" : "#20211D",
        transform: "rotate(-6deg)",
      }}
      title="Stock disponible"
    >
      {value}
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [usuario, setUsuario] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const submit = (e) => {
    e.preventDefault();
    const ok = onLogin(usuario.trim(), password);
    if (!ok) setError("Usuario o contraseña incorrectos.");
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center px-4" style={{ background: "#20211D" }}>
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <div className="inline-flex items-center justify-center rounded-full mx-auto mb-4" style={{ width: 64, height: 64, border: "2px solid #B8863C" }}>
            <IconBox size={28} color="#B8863C" />
          </div>
          <h1 className="text-3xl tracking-wide" style={{ fontFamily: "'Oswald', sans-serif", color: "#EFE7D8", letterSpacing: "0.04em" }}>
            SANTY SPORT
          </h1>
          <p className="text-sm mt-1" style={{ color: "#8A8272" }}>Sistema de Control de Inventarios</p>
        </div>

        <form onSubmit={submit} className="rounded-sm p-6 shadow-md" style={{ background: "#FAF6EE", border: "1px solid #3A3B34" }}>
          <label className="block text-xs font-mono uppercase tracking-widest mb-1" style={{ color: "#8A8272" }}>Usuario</label>
          <div className="flex items-center gap-2 mb-4 px-3 py-2 rounded-sm" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
            <IconUser size={16} color="#8A8272" />
            <input value={usuario} onChange={(e) => setUsuario(e.target.value)}
              className="w-full bg-transparent outline-none text-sm" style={{ color: "#20211D" }} placeholder="admin" autoFocus />
          </div>

          <label className="block text-xs font-mono uppercase tracking-widest mb-1" style={{ color: "#8A8272" }}>Contraseña</label>
          <div className="flex items-center gap-2 mb-2 px-3 py-2 rounded-sm" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
            <IconLock size={16} color="#8A8272" />
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
              className="w-full bg-transparent outline-none text-sm" style={{ color: "#20211D" }} placeholder="••••••••" />
          </div>

          {error && <p className="text-xs mt-2" style={{ color: "#B23A2E" }}>{error}</p>}

          <button type="submit" className="w-full mt-4 py-2.5 rounded-sm font-semibold text-sm tracking-wide hover:opacity-90"
            style={{ background: "#20211D", color: "#EFE7D8", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em" }}>
            INGRESAR AL SISTEMA
          </button>

          <StitchDivider />

          <p className="text-[11px] leading-relaxed" style={{ color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace" }}>
            Acceso Admin: admin / admin123<br />
            Acceso Empleado: empleado1 / empleado123
          </p>
        </form>
      </div>
    </div>
  );
}

function Sidebar({ user, view, setView, onLogout }) {
  const items = [
    { id: "dashboard", label: "Panel", icon: IconGrid },
    { id: "inventario", label: "Inventario", icon: IconBox },
    { id: "vender", label: "Registrar venta", icon: IconCart },
    { id: "historial", label: "Historial", icon: IconHistory },
  ];
  if (user.rol === "dueño") items.push({ id: "empleados", label: "Personal", icon: IconUsers });

  return (
    <div className="w-60 shrink-0 min-h-screen flex flex-col justify-between" style={{ background: "#20211D" }}>
      <div>
        <div className="px-5 pt-6 pb-5" style={{ borderBottom: "1px solid #3A3B34" }}>
          <div className="flex items-center gap-2">
            <IconBox size={22} color="#B8863C" />
            <span style={{ fontFamily: "'Oswald', sans-serif", color: "#EFE7D8", letterSpacing: "0.03em", fontSize: 18 }}>SANTY SPORT</span>
          </div>
          <p className="text-[11px] mt-2" style={{ color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace" }}>
            {user.nombre} ({user.rol})
          </p>
        </div>
        <nav className="py-3">
          {items.map((it) => {
            const Ic = it.icon;
            const active = view === it.id;
            return (
              <button key={it.id} onClick={() => setView(it.id)}
                className="w-full flex items-center gap-3 px-5 py-3 text-sm text-left transition-colors"
                style={{ color: active ? "#20211D" : "#C9C0AA", background: active ? "#B8863C" : "transparent", fontWeight: active ? 600 : 400 }}>
                <Ic size={17} />
                {it.label}
                {active && <IconChevronRight size={14} className="ml-auto" />}
              </button>
            );
          })}
        </nav>
      </div>
      <div className="px-5 pb-6">
        <StitchDivider />
        <button onClick={onLogout} className="w-full flex items-center gap-2 mt-2 py-2 text-sm hover:text-red-400 transition-colors" style={{ color: "#C9C0AA" }}>
          <IconLogout size={16} /> Cerrar sesión
        </button>
      </div>
    </div>
  );
}

function StatCard({ label, value, icon: Ic, accent }) {
  return (
    <div className="p-4 rounded-sm" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-[11px] uppercase tracking-widest" style={{ color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace" }}>{label}</span>
        <Ic size={16} color={accent || "#B8863C"} />
      </div>
      <div className="text-2xl font-bold" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>{value}</div>
    </div>
  );
}

function Dashboard({ products, sales }) {
  const totalProductos = products.length;
  const unidadesStock = products.reduce((s, p) => s + Number(p.stock), 0);
  const valorInventario = products.reduce((s, p) => s + Number(p.stock) * Number(p.precio), 0);
  const unidadesVendidas = products.reduce((s, p) => s + Number(p.vendidos || 0), 0);
  const ingresos = sales.reduce((s, v) => s + Number(v.total), 0);
  const bajoStock = products.filter((p) => Number(p.stock) <= LOW_STOCK);

  return (
    <div>
      <h2 className="text-2xl mb-5" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>PANEL PRINCIPAL</h2>
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
        <StatCard label="Modelos en catálogo" value={totalProductos} icon={IconBox} />
        <StatCard label="Pares en stock" value={unidadesStock} icon={IconBox} />
        <StatCard label="Valor inventario" value={money(valorInventario)} icon={IconDollar} />
        <StatCard label="Pares vendidos" value={unidadesVendidas} icon={IconTrendUp} />
        <StatCard label="Ingresos de venta" value={money(ingresos)} icon={IconCart} />
        <StatCard label="Alertas de Stock" value={bajoStock.length} icon={IconAlert} accent="#B23A2E" />
      </div>

      <div className="rounded-sm p-4" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <div className="flex items-center gap-2 mb-3">
          <IconAlert size={16} color="#B23A2E" />
          <h3 className="text-sm font-semibold" style={{ color: "#20211D" }}>Calzado con Stock Bajo (≤ {LOW_STOCK} pares)</h3>
        </div>
        {bajoStock.length === 0 ? (
          <p className="text-sm" style={{ color: "#8A8272" }}>El inventario está abastecido adecuadamente.</p>
        ) : (
          <ul className="divide-y" style={{ borderColor: "#E4DCC8" }}>
            {bajoStock.map((p) => (
              <li key={p.id} className="flex items-center justify-between py-2 text-sm">
                <span style={{ color: "#20211D" }}>{p.nombre} — {p.marca} (Talla: {p.talla}, Color: {p.color})</span>
                <span className="font-mono font-semibold" style={{ color: "#B23A2E" }}>{p.stock} pares</span>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

function ProductFormModal({ initial, onClose, onSave }) {
  const [form, setForm] = useState(
    initial || { nombre: "", marca: "", categoria: CATEGORIAS[0], talla: "", color: "", stock: "", precio: "", imagen: "" }
  );

  const [aiPrompt, setAiPrompt] = useState("");
  const [isGenerating, setIsGenerating] = useState(false);
  const [showAiBox, setShowAiBox] = useState(false);

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        set("imagen", reader.result);
      };
      reader.readAsDataURL(file);
    }
  };

  // Generador / Simulador de foto con IA
  const handleGenerateAi = () => {
    const promptText = aiPrompt || `${form.nombre} ${form.marca} zapato ${form.color}`;
    if (!promptText.trim()) return;

    setIsGenerating(true);

    setTimeout(() => {
      // Colección de imágenes de zapatos realistas por palabra clave
      const aiShoes = [
        "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=500&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=500&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1512374382149-233c42b6a83b?w=500&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500&auto=format&fit=crop",
      ];
      
      const randomImg = aiShoes[Math.floor(Math.random() * aiShoes.length)];
      set("imagen", randomImg);
      setIsGenerating(false);
      setShowAiBox(false);
    }, 1200);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.nombre || !form.marca || !form.talla || form.stock === "" || form.precio === "") return;
    onSave({
      ...form,
      talla: Number(form.talla),
      stock: Number(form.stock),
      precio: Number(form.precio),
      vendidos: initial ? form.vendidos : 0
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto" style={{ background: "rgba(32,33,29,0.7)" }}>
      <div className="w-full max-w-md rounded-sm p-6 shadow-2xl my-8" style={{ background: "#FAF6EE", border: "1px solid #B8863C" }}>
        <div className="flex items-center justify-between mb-4 border-b pb-2" style={{ borderColor: "#E4DCC8" }}>
          <h3 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 20, color: "#20211D" }}>
            {initial ? "EDITAR CALZADO" : "REGISTRAR NUEVO CALZADO"}
          </h3>
          <button onClick={onClose}><IconX size={18} color="#8A8272" /></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          {/* Carga e Integración con IA de Fotografía */}
          <div>
            <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: "#8A8272" }}>Fotografía del Producto</label>
            <div className="flex items-center gap-3 mb-2">
              <div className="w-20 h-20 rounded-sm border flex items-center justify-center overflow-hidden shrink-0 bg-white shadow-inner" style={{ borderColor: "#E4DCC8" }}>
                {form.imagen ? (
                  <img src={form.imagen} alt="Vista previa" className="w-full h-full object-cover" />
                ) : (
                  <IconImage size={24} color="#C9C0AA" />
                )}
              </div>
              <div className="flex-1 space-y-1.5">
                <div className="flex gap-2">
                  <label className="inline-flex items-center gap-1 px-2.5 py-1 rounded-sm text-xs cursor-pointer font-medium hover:bg-amber-100 transition-colors" style={{ background: "#EFE7D8", color: "#20211D", border: "1px solid #D8CCA8" }}>
                    <IconUpload size={13} /> Archivo
                    <input type="file" accept="image/*" onChange={handleFileChange} className="hidden" />
                  </label>
                  <button
                    type="button"
                    onClick={() => setShowAiBox(!showAiBox)}
                    className="inline-flex items-center gap-1 px-2.5 py-1 rounded-sm text-xs font-semibold hover:opacity-90 transition-opacity"
                    style={{ background: "#B8863C", color: "#20211D" }}
                  >
                    <IconSparkles size={13} /> Generar con IA
                  </button>
                </div>
                <input
                  type="text"
                  value={form.imagen}
                  onChange={(e) => set("imagen", e.target.value)}
                  placeholder="O pega el enlace URL aquí..."
                  className="w-full px-2 py-1 rounded-sm text-xs outline-none bg-white"
                  style={{ border: "1px solid #E4DCC8" }}
                />
              </div>
            </div>

            {/* Panel desplegable de IA */}
            {showAiBox && (
              <div className="p-3 rounded-sm my-2 text-xs border" style={{ background: "#20211D", color: "#EFE7D8", borderColor: "#B8863C" }}>
                <div className="flex items-center justify-between mb-1">
                  <span className="font-semibold text-amber-400 flex items-center gap-1"><IconSparkles size={12} /> Generador Visual IA</span>
                  <button type="button" onClick={() => setShowAiBox(false)}><IconX size={12} color="#8A8272" /></button>
                </div>
                <p className="text-[11px] mb-2" style={{ color: "#C9C0AA" }}>Describe el estilo de calzado que deseas renderizar:</p>
                <input
                  type="text"
                  value={aiPrompt}
                  onChange={(e) => setAiPrompt(e.target.value)}
                  placeholder={`Ej: ${form.nombre || 'Zapatos'} ${form.color || ''} estilo ${form.categoria || ''}`}
                  className="w-full px-2 py-1.5 rounded-sm text-xs mb-2 outline-none text-black"
                />
                <button
                  type="button"
                  onClick={handleGenerateAi}
                  disabled={isGenerating}
                  className="w-full py-1.5 rounded-sm font-semibold text-xs transition-opacity flex items-center justify-center gap-1"
                  style={{ background: "#B8863C", color: "#20211D" }}
                >
                  {isGenerating ? "Generando imagen con IA..." : "CREAR IMAGEN DE PRODUCTO"}
                </button>
              </div>
            )}
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Modelo / Nombre</label>
              <input value={form.nombre} onChange={(e) => set("nombre", e.target.value)} required placeholder="Ej: Court Vision"
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Marca</label>
              <input value={form.marca} onChange={(e) => set("marca", e.target.value)} required placeholder="Ej: Nike"
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Categoría</label>
              <select value={form.categoria} onChange={(e) => set("categoria", e.target.value)}
                className="w-full mt-1 px-2 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }}>
                {CATEGORIAS.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Talla</label>
              <input type="number" value={form.talla} onChange={(e) => set("talla", e.target.value)} required placeholder="38"
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Color</label>
              <input value={form.color} onChange={(e) => set("color", e.target.value)} required placeholder="Negro"
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Stock Inicial</label>
              <input type="number" min="0" value={form.stock} onChange={(e) => set("stock", e.target.value)} required placeholder="12"
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Precio ($ USD)</label>
              <input type="number" step="0.01" min="0" value={form.precio} onChange={(e) => set("precio", e.target.value)} required placeholder="65.00"
                className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8", background: "#FFF" }} />
            </div>
          </div>

          <button type="submit" className="w-full mt-4 py-2.5 rounded-sm font-semibold text-sm tracking-wide shadow"
            style={{ background: "#20211D", color: "#EFE7D8", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em" }}>
            {initial ? "GUARDAR CAMBIOS" : "GUARDAR EN INVENTARIO"}
          </button>
        </form>
      </div>
    </div>
  );
}

function Inventario({ products, isOwner, onAdd, onUpdate, onDelete }) {
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);

  const filtered = useMemo(() => {
    const s = search.toLowerCase();
    return products.filter((p) => 
      p.nombre.toLowerCase().includes(s) || 
      p.marca.toLowerCase().includes(s) || 
      p.categoria.toLowerCase().includes(s) ||
      (p.color && p.color.toLowerCase().includes(s))
    );
  }, [products, search]);

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <h2 className="text-2xl" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>INVENTARIO DE CALZADO</h2>
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-2 px-3 py-2 rounded-sm" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
            <IconSearch size={15} color="#8A8272" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar modelo, marca, color..."
              className="text-sm outline-none bg-transparent" style={{ width: 200 }} />
          </div>
          {isOwner && (
            <button onClick={() => setModal("new")} className="flex items-center gap-1.5 px-4 py-2 rounded-sm text-sm font-semibold shadow hover:opacity-90" style={{ background: "#B8863C", color: "#20211D" }}>
              <IconPlus size={16} /> NUEVO PRODUCTO
            </button>
          )}
        </div>
      </div>

      <div className="rounded-sm overflow-hidden" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <table className="w-full text-sm">
          <thead>
            <tr style={{ background: "#F1EADA", color: "#8A8272" }}>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Stock</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Foto</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Modelo</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Marca</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Categoría</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Talla</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Precio</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Vendidos</th>
              {isOwner && <th className="text-right px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Acciones</th>}
            </tr>
          </thead>
          <tbody>
            {filtered.map((p) => (
              <tr key={p.id} style={{ borderTop: "1px solid #F1EADA" }}>
                <td className="px-4 py-3"><StampBadge value={p.stock} danger={p.stock <= LOW_STOCK} /></td>
                <td className="px-4 py-3">
                  <div className="w-10 h-10 rounded-sm border flex items-center justify-center overflow-hidden bg-white shrink-0" style={{ borderColor: "#E4DCC8" }}>
                    {p.imagen ? (
                      <img src={p.imagen} alt={p.nombre} className="w-full h-full object-cover" />
                    ) : (
                      <IconImage size={18} color="#C9C0AA" />
                    )}
                  </div>
                </td>
                <td className="px-4 py-3 font-medium" style={{ color: "#20211D" }}>{p.nombre}<div className="text-xs" style={{ color: "#8A8272" }}>Color: {p.color}</div></td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{p.marca}</td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{p.categoria}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{p.talla}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{money(p.precio)}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{p.vendidos || 0}</td>
                {isOwner && (
                  <td className="px-4 py-3">
                    <div className="flex items-center justify-end gap-2">
                      <button onClick={() => setModal(p)} title="Editar"><IconEdit size={16} color="#8A8272" /></button>
                      <button onClick={() => onDelete(p.id)} title="Eliminar"><IconTrash size={16} color="#B23A2E" /></button>
                    </div>
                  </td>
                )}
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan={isOwner ? 9 : 8} className="text-center py-8 text-sm" style={{ color: "#8A8272" }}>Sin productos coincidentes.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {modal && (
        <ProductFormModal
          initial={modal === "new" ? null : modal}
          onClose={() => setModal(null)}
          onSave={(data) => {
            if (modal === "new") {
              onAdd({ ...data, id: "p_" + Date.now() });
            } else {
              onUpdate(modal.id, data);
            }
            setModal(null);
          }}
        />
      )}
    </div>
  );
}

function Vender({ products, onVender, user }) {
  const [productoId, setProductoId] = useState(products[0]?.id || "");
  const [cantidad, setCantidad] = useState(1);
  const [msg, setMsg] = useState(null);

  useEffect(() => { if (!productoId && products[0]) setProductoId(products[0].id); }, [products]);

  const producto = products.find((p) => p.id === productoId);
  const total = producto ? producto.precio * Number(cantidad || 0) : 0;

  const submit = (e) => {
    e.preventDefault();
    if (!producto) return;
    const cant = Number(cantidad);
    if (!cant || cant <= 0) { setMsg({ type: "error", text: "Ingresa una cantidad válida." }); return; }
    if (cant > producto.stock) { setMsg({ type: "error", text: `Solo hay ${producto.stock} unidades en stock.` }); return; }
    onVender(producto, cant, user.nombre);
    setMsg({ type: "ok", text: `Venta exitosa: ${cant} × ${producto.nombre} (${money(cant * producto.precio)})` });
    setCantidad(1);
  };

  return (
    <div>
      <h2 className="text-2xl mb-5" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>REGISTRAR VENTA</h2>
      <div className="max-w-md rounded-sm p-5" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: "#8A8272" }}>Seleccionar Calzado</label>
            <select value={productoId} onChange={(e) => setProductoId(e.target.value)} className="w-full px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8", background: "#FFF" }}>
              {products.map((p) => <option key={p.id} value={p.id}>{p.nombre} — {p.marca} (Talla: {p.talla}, Stock: {p.stock})</option>)}
            </select>
          </div>
          {producto && (
            <div className="flex items-center gap-3 p-3 rounded-sm" style={{ background: "#FAF6EE", border: "1px solid #E4DCC8" }}>
              <div className="w-12 h-12 rounded-sm border flex items-center justify-center overflow-hidden bg-white shrink-0" style={{ borderColor: "#E4DCC8" }}>
                {producto.imagen ? (
                  <img src={producto.imagen} alt={producto.nombre} className="w-full h-full object-cover" />
                ) : (
                  <IconImage size={20} color="#C9C0AA" />
                )}
              </div>
              <div className="text-xs" style={{ color: "#20211D" }}>
                <p className="font-semibold">{producto.nombre}</p>
                <p style={{ color: "#8A8272" }}>Color: {producto.color} | Precio: {money(producto.precio)}</p>
              </div>
            </div>
          )}
          <div>
            <label className="text-[11px] uppercase tracking-widest block mb-1" style={{ color: "#8A8272" }}>Cantidad</label>
            <input type="number" min={1} value={cantidad} onChange={(e) => setCantidad(e.target.value)} className="w-full px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8" }} />
          </div>
          <StitchDivider />
          <div className="flex items-center justify-between text-sm">
            <span style={{ color: "#8A8272" }}>Total a cobrar</span>
            <span className="font-mono text-xl font-bold" style={{ color: "#20211D" }}>{money(total)}</span>
          </div>
          {msg && <p className="text-xs font-semibold" style={{ color: msg.type === "ok" ? "#4C7A5D" : "#B23A2E" }}>{msg.text}</p>}
          <button type="submit" disabled={!producto} className="w-full py-2.5 rounded-sm font-semibold text-sm tracking-wide flex items-center justify-center gap-2"
            style={{ background: "#B8863C", color: "#20211D", fontFamily: "'Oswald', sans-serif", letterSpacing: "0.05em" }}>
            <IconCart size={16} /> CONFIRMAR VENTA
          </button>
        </form>
      </div>
    </div>
  );
}

function Historial({ sales }) {
  const sorted = [...sales].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  const ingresos = sales.reduce((s, v) => s + Number(v.total), 0);
  const unidades = sales.reduce((s, v) => s + Number(v.cantidad), 0);

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h2 className="text-2xl" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>HISTORIAL DE VENTAS</h2>
        <div className="flex gap-3 text-sm font-mono" style={{ color: "#20211D" }}>
          <span>{unidades} pares vendidos</span><span>·</span><span className="font-semibold">{money(ingresos)}</span>
        </div>
      </div>
      <div className="rounded-sm overflow-hidden" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
        <table className="w-full text-sm">
          <thead>
            <tr style={{ background: "#F1EADA", color: "#8A8272" }}>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Fecha</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Producto</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Cant.</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">P. Unitario</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Total</th>
              <th className="text-left px-4 py-2.5 font-mono text-[11px] uppercase tracking-widest">Vendedor</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((v) => (
              <tr key={v.id} style={{ borderTop: "1px solid #F1EADA" }}>
                <td className="px-4 py-3 font-mono text-xs" style={{ color: "#8A8272" }}>{new Date(v.fecha).toLocaleString("es-EC", { dateStyle: "medium", timeStyle: "short" })}</td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{v.productoNombre} <span className="text-xs" style={{ color: "#8A8272" }}>(Talla {v.talla})</span></td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{v.cantidad}</td>
                <td className="px-4 py-3 font-mono" style={{ color: "#20211D" }}>{money(v.precioUnitario)}</td>
                <td className="px-4 py-3 font-mono font-semibold" style={{ color: "#20211D" }}>{money(v.total)}</td>
                <td className="px-4 py-3" style={{ color: "#20211D" }}>{v.vendedor}</td>
              </tr>
            ))}
            {sorted.length === 0 && <tr><td colSpan={6} className="text-center py-8 text-sm" style={{ color: "#8A8272" }}>No hay registro de ventas acumuladas.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Empleados({ users, onAdd, onDelete, currentUser }) {
  const [form, setForm] = useState({ usuario: "", password: "", nombre: "" });
  const [error, setError] = useState("");

  const submit = (e) => {
    e.preventDefault();
    if (!form.usuario || !form.password || !form.nombre) return;
    if (users.some((u) => u.usuario === form.usuario)) { setError("El usuario ingresado ya existe."); return; }
    onAdd({ ...form, rol: "empleado" });
    setForm({ usuario: "", password: "", nombre: "" });
    setError("");
  };

  return (
    <div>
      <h2 className="text-2xl mb-5" style={{ fontFamily: "'Oswald', sans-serif", color: "#20211D" }}>GESTIÓN DE PERSONAL</h2>
      <div className="grid md:grid-cols-2 gap-5">
        <div className="rounded-sm p-5" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
          <h3 className="text-sm font-semibold mb-3" style={{ color: "#20211D" }}>Usuarios del Sistema</h3>
          <ul className="divide-y" style={{ borderColor: "#F1EADA" }}>
            {users.map((u) => (
              <li key={u.usuario} className="flex items-center justify-between py-2.5 text-sm">
                <div>
                  <span style={{ color: "#20211D" }}>{u.nombre}</span>
                  <div className="text-xs font-mono" style={{ color: "#8A8272" }}>@{u.usuario} · {u.rol}</div>
                </div>
                {u.rol !== "dueño" && u.usuario !== currentUser.usuario && (
                  <button onClick={() => onDelete(u.usuario)} title="Eliminar cuenta"><IconTrash size={16} color="#B23A2E" /></button>
                )}
              </li>
            ))}
          </ul>
        </div>
        <div className="rounded-sm p-5" style={{ background: "#FFFFFF", border: "1px solid #E4DCC8" }}>
          <h3 className="text-sm font-semibold mb-3" style={{ color: "#20211D" }}>Registrar Nuevo Empleado</h3>
          <form onSubmit={submit} className="space-y-3">
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Nombre completo</label>
              <input value={form.nombre} onChange={(e) => setForm((f) => ({ ...f, nombre: e.target.value }))} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none" style={{ border: "1px solid #E4DCC8" }} required />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Nombre de Usuario</label>
              <input value={form.usuario} onChange={(e) => setForm((f) => ({ ...f, usuario: e.target.value }))} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8" }} required />
            </div>
            <div>
              <label className="text-[11px] uppercase tracking-widest block" style={{ color: "#8A8272" }}>Contraseña</label>
              <input type="password" value={form.password} onChange={(e) => setForm((f) => ({ ...f, password: e.target.value }))} className="w-full mt-1 px-3 py-2 rounded-sm text-sm outline-none font-mono" style={{ border: "1px solid #E4DCC8" }} required />
            </div>
            {error && <p className="text-xs text-red-600">{error}</p>}
            <button type="submit" className="w-full mt-2 py-2.5 rounded-sm font-semibold text-sm tracking-wide"
              style={{ background: "#20211D", color: "#EFE7D8", fontFamily: "'Oswald', sans-serif" }}>
              CREAR USUARIO
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [view, setView] = useState("dashboard");

  const [products, setProducts] = useStorageState("santysport_products", seedProducts);
  const [users, setUsers] = useStorageState("santysport_users", seedUsers);
  const [sales, setSales] = useStorageState("santysport_sales", seedSales);

  const handleLogin = (usr, pwd) => {
    const found = users.find((u) => u.usuario === usr && u.password === pwd);
    if (found) {
      setCurrentUser(found);
      return true;
    }
    return false;
  };

  const handleAddProduct = (item) => {
    setProducts([item, ...products]);
  };

  const handleUpdateProduct = (id, data) => {
    setProducts(products.map((p) => (p.id === id ? { ...p, ...data } : p)));
  };

  const handleDeleteProduct = (id) => {
    setProducts(products.filter((p) => p.id !== id));
  };

  const handleVender = (product, cantidad, vendedor) => {
    const total = product.precio * cantidad;
    
    // Actualizar stock y ventas en inventario
    setProducts(
      products.map((p) =>
        p.id === product.id
          ? { ...p, stock: p.stock - cantidad, vendidos: (p.vendidos || 0) + cantidad }
          : p
      )
    );

    // Guardar en el historial
    const newSale = {
      id: "v_" + Date.now(),
      fecha: new Date().toISOString(),
      productoNombre: product.nombre,
      talla: product.talla,
      cantidad,
      precioUnitario: product.precio,
      total,
      vendedor,
    };
    setSales([newSale, ...sales]);
  };

  const handleAddUser = (user) => {
    setUsers([...users, user]);
  };

  const handleDeleteUser = (username) => {
    setUsers(users.filter((u) => u.usuario !== username));
  };

  if (!currentUser) return <LoginScreen onLogin={handleLogin} />;

  return (
    <div className="flex min-h-screen">
      <Sidebar user={currentUser} view={view} setView={setView} onLogout={() => setCurrentUser(null)} />
      <main className="flex-1 p-8 overflow-y-auto">
        {view === "dashboard" && <Dashboard products={products} sales={sales} />}
        {view === "inventario" && (
          <Inventario
            products={products}
            isOwner={currentUser.rol === "dueño"}
            onAdd={handleAddProduct}
            onUpdate={handleUpdateProduct}
            onDelete={handleDeleteProduct}
          />
        )}
        {view === "vender" && <Vender products={products} onVender={handleVender} user={currentUser} />}
        {view === "historial" && <Historial sales={sales} />}
        {view === "empleados" && (
          <Empleados
            users={users}
            onAdd={handleAddUser}
            onDelete={handleDeleteUser}
            currentUser={currentUser}
          />
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
