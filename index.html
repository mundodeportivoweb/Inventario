<!-- Cargar TensorFlow.js y MobileNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<script>
let model;

// Cargar el modelo al iniciar la app
async function cargarModeloIA() {
  console.log("Cargando modelo de reconocimiento visual...");
  model = await mobilenet.load();
  console.log("Modelo de IA listo.");
}
cargarModeloIA();

async function procesarFotoVenta(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Mostrar vista previa
  const imgElement = document.getElementById('photoPreview');
  imgElement.src = URL.createObjectURL(file);
  document.getElementById('previewContainer').style.display = 'block';

  // Analizar la imagen cuando cargue
  imgElement.onload = async () => {
    if (!model) return;
    
    // Predicción inteligente
    const predictions = await model.classify(imgElement);
    console.log('Predicciones:', predictions);

    // Identificar palabras clave (ej: "running shoe", "sneaker")
    const coincidencia = predictions.find(p => 
      p.className.includes('shoe') || 
      p.className.includes('sneaker') || 
      p.className.includes('running')
    );

    if (coincidencia) {
      alert(`Detectado tipo de calzado: ${coincidencia.className}`);
      // Aquí puedes filtrar tu tabla de productos por categorías similares
    }
  };
}
</script>
